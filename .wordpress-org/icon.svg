<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Collage</title>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dy="1.5" stdDeviation="2" flood-color="#0b1440" flood-opacity=".3"/>
    </filter>
    <g id="sheet">
      <rect width="40" height="52" rx="5" fill="#fff"/>
      <rect x="6" y="7" width="17" height="3" rx="1.5" fill="#c3c4c7"/>
      <g fill="#e2e4e7">
        <rect x="6" y="14" width="28" height="2.2" rx="1.1"/>
        <rect x="6" y="19" width="23" height="2.2" rx="1.1"/>
        <rect x="6" y="24" width="26" height="2.2" rx="1.1"/>
        <rect x="6" y="29" width="16" height="2.2" rx="1.1"/>
      </g>
    </g>
  </defs>
  <rect width="128" height="128" rx="28" fill="#3858e9"/>
  <g filter="url(#shadow)" transform="translate(42.04 68.1) rotate(-10) scale(1.22) translate(-20 -26)">
    <use href="#sheet"/>
    <rect x="6" y="40" width="16" height="6" rx="2" fill="#f0f0f1"/>
    <rect x="9" y="42" width="10" height="2" rx="1" fill="#a7aaad"/>
  </g>
  <g filter="url(#shadow)" transform="translate(85.96 68.1) rotate(10) scale(1.22) translate(-20 -26)">
    <use href="#sheet"/>
    <rect x="18" y="40" width="16" height="6" rx="2" fill="#f0f0f1"/>
    <rect x="21" y="42" width="10" height="2" rx="1" fill="#a7aaad"/>
  </g>
  <g filter="url(#shadow)" transform="translate(64 59.56) scale(1.22) translate(-20 -26)">
    <use href="#sheet"/>
    <rect x="6" y="40" width="16" height="6" rx="2" fill="#e3e8fc"/>
    <rect x="9" y="42" width="10" height="2" rx="1" fill="#3858e9"/>
  </g>
</svg>
